[package]
name = "argent-engine"
version = "1.0.1"
edition = "2021"
description = "ARGENT DEFENDER scanning, intelligence and forensic engine"
license = "Proprietary"

[lib]
name = "argent"
path = "src/lib.rs"

[[bin]]
name = "argent-engine"
path = "src/main.rs"

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
aes-kw = "0.3.1"
anyhow = "1.0.104"
base64 = "0.23.1"
cbc = "0.2.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
idna = "1.1.0"
libc = "0.2.191"
md-5 = "0.11.0"
ml-dsa = "0.1.2"
ml-kem = "0.3.4"
pbkdf2 = "0.13.0"
plist = "1.10.3"
psl = "2.1.250"
rand_core = "0.10.1"
rayon = "1.12.0"
rsa = { version = "0.10", default-features = false, features = ["pkcs1v15"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
ureq = "3.5.1"
walkdir = "2.5.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
yara-x = "1.23.0"
zip = "9.5.0"

[dev-dependencies]
tempfile = "3.27.0"
